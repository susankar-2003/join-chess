<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join Crown Chess Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: #F5F2EB;
            color: #333333;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #D4CFC7;
            border-top: 4px solid #5B8266;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
    <script>
        window.onload = function() {
            // 1. Grab the code from the URL (e.g., ?code=1234)
            const urlParams = new URLSearchParams(window.location.search);
            const gameCode = urlParams.get('code') || '';

            // 2. Your App's Exact Package Name
            const packageName = "com.crown.chess"; 

            // 3. The testing link for Google Play
            const playStoreLink = "https://play.google.com/apps/testing/" + packageName;

            // 4. The Magic Android Intent URL with automatic Play Store fallback
            const intentUrl = "intent://join?code=" + gameCode + 
                              "#Intent;scheme=crownchess;package=" + packageName + 
                              ";S.browser_fallback_url=" + encodeURIComponent(playStoreLink) + ";end";

            // 5. Instantly attempt to open the app or fallback to the Play Store
            window.location.href = intentUrl;
        };
    </script>
</head>
<body>
    <div class="loader"></div>
    <h2>Opening Crown Chess...</h2>
    <p>If you don't have the app installed, you will be redirected to the Play Store.</p>
</body>
</html>
