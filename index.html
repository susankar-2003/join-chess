<!DOCTYPE html>
<html>
<head>
    <title>Join Crown Chess Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: #F5F2EB;
            color: #333333;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #D4CFC7;
            border-top: 4px solid #5B8266;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        window.onload = function() {
            // 1. Grab the code from the URL (e.g., ?code=1234)
            const urlParams = new URLSearchParams(window.location.search);
            const gameCode = urlParams.get('code') || '';

            // 2. Your App's Exact Package Name
            const packageName = "com.crown.chess"; 

            // 3. The testing link for Google Play
            // (Use the web testing link Google provides, usually formatted like this)
            const playStoreLink = "https://play.google.com/apps/testing/" + packageName;

            // 4. The Magic Android Intent URL
            // This aggressively tells the phone's browser to open the app!
            const intentUrl = "intent://join?code=" + gameCode + "#Intent;scheme=crownchess;package=" + packageName + ";end";
            // First, try to instantly open the app
            window.location.href = intentUrl;

            // If the app is NOT installed, the intent will fail. 
            // We wait 2 seconds, then redirect them to the Play Store.
            setTimeout(function() {
                window.location.href = playStoreLink;
            }, 2000); 
        };
    </script>
</head>
<body>
    <div class="loader"></div>
    <h2>Opening Crown Chess...</h2>
    <p>If the app does not open automatically, you will be redirected to the Play Store.</p>
</body>
</html>
